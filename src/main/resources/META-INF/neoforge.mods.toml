modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "superficialtrauma_logo.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "superficialtrauma.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.252,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional reflection-based integration with the supplied NeoForge CGM port.
[[dependencies."${mod_id}"]]
modId = "cgm"
type = "optional"
versionRange = "[1.4.4,)"
ordering = "AFTER"
side = "BOTH"
