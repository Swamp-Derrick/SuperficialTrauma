buildscript {
    repositories {
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

def compatibilityModsDirectory = file(findProperty('compatibility_mods_dir') ?: '../Compatiblemods')
def compatibilityModsEnabled = (findProperty('enable_compatibility_mods') ?: 'false').toBoolean()
def compatibilityArtifacts = [
        [name: 'framework-forge-1.20.1', version: '0.6.16', file: 'framework-forge-1.20.1-0.6.16.jar'],
        [name: 'CGM-Unofficial', version: '1.4.20+Forge+1.20.1+valfucked', file: 'CGM-Unofficial-1.4.20+Forge+1.20.1+valfucked.jar'],
        [name: 'nzgExpansionUnofficialSD', version: '1.4.4-1.20.1', file: 'nzgExpansionUnofficialSD-1.4.4-1.20.1.jar'],
        [name: 'redundantGunsUnofficialSD', version: '1.0.0-1.20.1', file: 'redundantGunsUnofficialSD-1.0.0-1.20.1.jar'],
        [name: 'voicechat-forge-1.20.1', version: '2.6.21', file: 'voicechat-forge-1.20.1-2.6.21.jar']
]

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            if (compatibilityModsEnabled) {
                // Production mod jars contain SRG refmaps. In a Mojang-mapped
                // userdev run, use the original annotation names instead.
                property 'mixin.env.disableRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    if (compatibilityModsEnabled) {
        flatDir {
            dirs compatibilityModsDirectory
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    if (compatibilityModsEnabled) {
        compatibilityArtifacts.each { artifact ->
            implementation fg.deobf("local:${artifact.name}:${artifact.version}")
        }
    }
}

tasks.register('verifyCompatibilityMods') {
    group = 'verification'
    description = 'Checks the exact local compatibility-mod baseline used for development.'

    doLast {
        def missingFiles = compatibilityArtifacts.collect { artifact ->
            new File(compatibilityModsDirectory, artifact.file)
        }.findAll { jar -> !jar.isFile() }

        if (!missingFiles.isEmpty()) {
            throw new GradleException('Missing compatibility mods:\n' + missingFiles.collect { ' - ' + it }.join('\n'))
        }

        logger.lifecycle("Verified ${compatibilityArtifacts.size()} compatibility mods in ${compatibilityModsDirectory}")
    }
}

if (compatibilityModsEnabled) {
    tasks.named('compileJava').configure {
        dependsOn tasks.named('verifyCompatibilityMods')
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.register('bodyStateSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the phase-0 BodyState threshold and NBT round-trip regression test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.swampd.superficialtrauma.common.body.BodyStateRoundTripTest'
}

tasks.named('check').configure {
    dependsOn tasks.named('bodyStateSelfTest')
}
