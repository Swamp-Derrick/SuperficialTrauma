plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group_id
version = mod_version
base { archivesName = "${mod_id}-neoforge-${minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
def compatibilityModsDirectory = file(findProperty('compatibility_mods_dir') ?: '../Compatiblemods-1.21.1')
def compatibilityModsEnabled = (findProperty('enable_compatibility_mods') ?: 'false').toBoolean()
def voicechatEnabled = (findProperty('enable_voicechat_mod') ?: 'false').toBoolean()
def voicechatJar = file(findProperty('voicechat_mod_jar') ?: '../Compatiblemods-1.21.1/voicechat-neoforge-1.21.1-2.6.24.jar')
def compatibilityArtifacts = [
        'framework-neoforge-1.21.1-0.13.11.jar',
        'cgm-1.4.4.jar',
        'nzgExpansion-neoforge-1.5.0-port.1+1.21.1.jar'
]
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
neoForge {
    version = project.neo_version
    runs {
        configureEach {
            // Do not upgrade the existing 1.20.1 development world.
            gameDirectory = project.file('run-1.21.1')
            systemProperty 'forge.logging.console.level', 'info'
        }
        client {
            client()
            if ((findProperty('enable_migration_client_smoke') ?: 'false').toBoolean()) {
                systemProperty 'superficialtrauma.clientSmoke', 'true'
            }
            if ((findProperty('enable_voicechat_client_smoke') ?: 'false').toBoolean()) {
                systemProperty 'superficialtrauma.clientSmoke', 'true'
                systemProperty 'superficialtrauma.voicechatSmoke', 'true'
            }
            if ((findProperty('enable_world_audio_client_smoke') ?: 'false').toBoolean()) {
                systemProperty 'superficialtrauma.clientSmoke', 'true'
                systemProperty 'superficialtrauma.worldAudioSmoke', 'true'
            }
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            gameDirectory = project.file('run-data-1.21.1')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
    addModdingDependenciesTo sourceSets.gameTest
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            if ((findProperty('enable_migration_gametests') ?: 'false').toBoolean()) sourceSet sourceSets.gameTest
        }
    }
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
configurations { runtimeClasspath.extendsFrom localRuntime }
repositories {
    maven {
        url = 'https://maven.maxhenkel.de/repository/public'
        content { includeGroup 'de.maxhenkel.voicechat' }
    }
}
dependencies {
    // Compile against the API, but never embed it or the optional voice mod in our JAR.
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.24'
    gameTestCompileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.24'
    testImplementation 'de.maxhenkel.voicechat:voicechat-api:2.6.24'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (compatibilityModsEnabled) {
        localRuntime files(compatibilityArtifacts.collect { new File(compatibilityModsDirectory, it) })
    }
    if (voicechatEnabled) {
        if (!voicechatJar.isFile()) throw new GradleException('Missing optional Simple Voice Chat JAR: ' + voicechatJar)
        localRuntime files(voicechatJar)
    }
}
tasks.register('verifyCompatibilityMods') {
    group = 'verification'
    doLast {
        def missing = compatibilityArtifacts.collect { new File(compatibilityModsDirectory, it) }.findAll { !it.isFile() }
        if (!missing.isEmpty()) throw new GradleException('Missing compatibility mods: ' + missing.join(', '))
        logger.lifecycle("Verified ${compatibilityArtifacts.size()} NeoForge compatibility mods in ${compatibilityModsDirectory}")
    }
}
if (compatibilityModsEnabled) {
    tasks.named('compileJava') { dependsOn tasks.named('verifyCompatibilityMods') }
}
tasks.named('processResources', ProcessResources) {
    def properties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                      neo_version: neo_version, loader_version_range: loader_version_range,
                      mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                      mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties properties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand properties }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll('-Xlint:deprecation', '-Xmaxerrs', '500')
}

tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
}
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
}
tasks.register('bodyStateSelfTest') {
    group = 'verification'
    dependsOn tasks.named('test')
}
tasks.register('vitalSignsVisualSelfTest') {
    group = 'verification'
    dependsOn tasks.named('test')
}
tasks.named('check') {
    dependsOn tasks.named('bodyStateSelfTest'), tasks.named('vitalSignsVisualSelfTest')
}
